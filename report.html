<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><title>Khata Report</title>
<style>
:root{--paper:#F3E9D6;--ink:#2B1B12;--soft:#5B4636;--red:#8B2635;--green:#3F6F52;--line:rgba(184,134,62,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:16px 12px 40px}
.wrap{max-width:640px;margin:0 auto}.card{background:#fff8ea;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(43,27,18,.12);margin-bottom:12px}
h1{margin:0;font-size:22px;color:var(--red)}h2{margin:0 0 8px;font-size:15px;color:var(--red)}.sub{font-size:12px;color:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.k small{display:block;font-size:11px;color:var(--soft)}.k b{font-size:17px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.row small{display:block;color:var(--soft);font-size:11px}
details{border-bottom:1px dashed var(--line);padding:6px 0}summary{cursor:pointer;display:flex;justify-content:space-between;font-size:14px;font-weight:600}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:8px}.r{color:var(--red)}.g{color:var(--green)}.ro{font-size:11px;color:var(--soft);text-align:center}
</style></head><body><div class="wrap" id="app"><div class="card">Load ho raha hai...</div></div>
<script src="config.js"></script>
<script>
(function(){
const app=document.getElementById('app'),t=location.hash.slice(1).replace(/[^a-f0-9]/g,''),CK='kh_report_'+t;
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'Rs '+Math.round(n||0).toLocaleString('en-US'),D=ms=>new Date(ms).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const K=(l,v,c)=>`<div class="k"><small>${l}</small><b class="${c||''}">${R(v)}</b></div>`;
const list=(a,f,empty)=>a&&a.length?a.map(f).join(''):`<div class="sub">${empty||'Kuch nahi.'}</div>`;
function draw(d,note){
  const T=d.totals||{},cs=(d.customers||[]).slice().sort((a,b)=>b.balance-a.balance),due=cs.reduce((s,c)=>s+Math.max(0,c.balance),0);
  const days=b=>Math.round((new Date(b.due+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);
  app.innerHTML=`<div class="card"><h1>${E(d.shop||'Khata')}</h1><div class="sub">${E(d.owner)} • Aakhri update: ${D(d.updated)} ${note||''}<br>⏳ Ye link ${d.exp?new Date(d.exp).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' tak chalega':'temporary hai'}</div></div>
  <div class="card"><h2>Summary</h2><div class="grid">${K('Customers ka baqaya',due,'r')}${K('Cash on hand',T.cashOnHand,T.cashOnHand<0?'r':'g')}${K('Capital',T.totalCapital)}${K('Stock value',T.stockValue)}${K('Customers se mila',T.totalReceived,'g')}${K('Total expenses',T.totalExpenses)}</div></div>
  <div class="card"><h2>Rent &amp; Bills</h2>${list(d.bills,b=>`<div class="row"><div>${E(b.n)}<small>${D(new Date(b.due+'T00:00:00'))} • ${days(b)<0?(-days(b))+' din late':days(b)+' din baqi'}${b.rep?' • monthly':''}</small></div><b>${R(b.a)}</b></div>`,'Koi bill nahi.')}</div>
  <div class="card"><h2>Customers (${cs.length})</h2><input id="q" placeholder="Naam se dhundein">
  <div id="cl">${list(cs,c=>`<details data-n="${E(c.name.toLowerCase())}"><summary><span>${E(c.name)}</span><span class="${c.balance>0?'r':'g'}">${R(c.balance)}</span></summary>${c.phone?`<div class="sub">📞 ${E(c.phone)}</div>`:''}${list((c.entries||[]).slice().sort((a,b)=>b.t-a.t),x=>x.k==='i'?`<div class="row"><div>${E(x.n)}<small>${D(x.t)} • ${E(x.q)} × ${R(x.r)}</small></div><b class="r">${R(x.a)}</b></div>`:`<div class="row"><div>Payment mili<small>${D(x.t)}</small></div><b class="g">− ${R(x.a)}</b></div>`,'Koi entry nahi.')}</details>`)}</div></div>
  <div class="card"><h2>Stock</h2>${list(d.inventory,i=>`<div class="row"><div>${E(i.n)}<small>Qty ${E(i.q)} • Cost ${R(i.c)} • Sell ${R(i.s)}</small></div><b>${R(i.q*i.c)}</b></div>`)}</div>
  <div class="card"><h2>Expenses</h2>${list(d.expenses,x=>`<div class="row"><div>${E(x.n)}<small>${D(x.t)} • ${E(x.c)}</small></div><b>${R(x.a)}</b></div>`)}</div>
  <div class="card"><h2>Capital</h2>${list(d.capital,x=>`<div class="row"><div>${E(x.n||'Capital')}<small>${D(x.t)}</small></div><b>${R(x.a)}</b></div>`)}</div>
  <div class="card"><h2>Stock purchases</h2>${list(d.purchases,x=>`<div class="row"><div>${E(x.n)}<small>${D(x.t)} • Qty ${E(x.q)}</small></div><b>${R(x.a)}</b></div>`)}</div>
  <div class="ro">🔒 Sirf dekhne ke liye</div>`;
  document.getElementById('q').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('#cl details').forEach(x=>x.hidden=!x.dataset.n.includes(v));};
}
if(t.length<32){app.innerHTML='<div class="card">Ye link sahi nahi hai.</div>';return;}
const C=window.KHATA_CFG,h={'apikey':C.KEY,'Content-Type':'application/json'};if(C.KEY.startsWith('eyJ'))h.Authorization='Bearer '+C.KEY;
fetch(C.URL+'/rest/v1/rpc/get_shared',{method:'POST',headers:h,body:JSON.stringify({p_token:t})}).then(r=>r.json()).then(d=>{
  if(!d||!d.full){try{localStorage.removeItem(CK)}catch(e){}app.innerHTML='<div class="card"><h2>Link band ho gaya</h2>Is link ka waqt khatam ho gaya hai (ya link galat hai). Naya link mangwayein.</div>';return;}
  try{localStorage.setItem(CK,JSON.stringify(d))}catch(e){}draw(d);
}).catch(()=>{const c=localStorage.getItem(CK);const cd=c&&JSON.parse(c);if(cd&&(!cd.exp||cd.exp>Date.now()))draw(cd,'(Offline: purana data)');else if(c){localStorage.removeItem(CK);app.innerHTML='<div class="card"><h2>Link band ho gaya</h2>Is link ka waqt khatam ho gaya hai.</div>';}else app.innerHTML='<div class="card">Internet chahiye.</div>';});
})();
</script></body></html>
